<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Summer 2027 CS & Cybersecurity Internships</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Summer 2027 CS & Cybersecurity Internships</h1>
    <input id="search" type="search" placeholder="Search jobs, companies, locations...">
    <div class="table-wrap">
      <table id="jobs">
        <thead>
          <tr>
            <th data-key="company">Company</th>
            <th data-key="role">Role</th>
            <th data-key="category">Category</th>
            <th data-key="location">Location</th>
            <th data-key="work_arrangement">Work arrangement</th>
            <th data-key="open_date">Open date</th>
            <th data-key="close_date">Close date</th>
            <th data-key="hourly_rate">Hourly rate</th>
            <th data-key="estimated_total_compensation">Estimated total compensation</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
