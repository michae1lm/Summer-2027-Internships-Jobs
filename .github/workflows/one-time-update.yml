name: One-time tracker update
on:
  push:
    paths:
      - one_time_update.py
      - run_tracker_update.txt
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update tracker data
        run: python one_time_update.py
      - name: Commit updated tracker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opportunities.json opportunities.csv README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update internship tracker with new and enriched roles"
          git push
